# ─────────────────────────────────────────────────────────────────────────────
# Mediu de TEST — complet izolat de producție.
#
# Bază de date Postgres LOCALĂ (container efemer, NU Neon, NU date reale) +
# backend pe portul 8001 (ca să nu intre în conflict cu localul pe 8000).
# Folosește imaginea slim (ca producția) → oglindește prod + build rapid.
#
# Pornire:   docker compose -p etox-test -f docker-compose.test.yml up -d --build
# Backend:   http://localhost:8001   (ENV=development → /docs vizibil)
# Frontend:  http://localhost:3001
# Mailpit:   http://localhost:8025   (emailurile de test nu părăsesc mediul local)
# Reset DB:  docker compose -p etox-test -f docker-compose.test.yml down -v
#            (șterge exclusiv volumul bazei de date de test)
#
# Valorile de mai jos sunt de TEST (fără secrete reale) — de aceea fișierul e comis.
# ─────────────────────────────────────────────────────────────────────────────
name: etox-test

services:
  test-db:
    image: postgres:17-alpine          # la fel ca Neon (PG 17) — evită incompatibilități de schemă
    container_name: etox-test-db
    environment:
      POSTGRES_USER: etox
      POSTGRES_PASSWORD: etox_test
      POSTGRES_DB: etox_test
    ports:
      - "127.0.0.1:5433:5432"  # accesibil doar de pe calculatorul local
    volumes:
      - test_db_data:/var/lib/postgresql/data
      # Schema de bază (extrasă din Neon) — rulează AUTOMAT la prima inițializare a DB-ului.
      # Conține tot schema + schema_migrations populat, deci backend-ul sare peste migrări.
      - ./edu_content_api/db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etox -d etox_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./edu_content_api
      dockerfile: Dockerfile.prod    # slim, la fel ca producția
    container_name: etox-test-backend
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://etox:etox_test@test-db:5432/etox_test?sslmode=disable
      - JWT_SECRET_KEY=test-only-secret-nu-folosi-in-productie-minim-32-caractere
      - ENV=development
      - APP_URL=http://localhost:3001
      # Acceptă atât frontendul Docker (:3001), cât și serverele locale uzuale.
      # Toate sunt loopback; nicio origine externă/producție nu este permisă.
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173
      - EXAM_DATE=2027-06-30   # data BAC pentru countdown (config, nu hardcodat)
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      - SMTP_FROM=test@e2xacademy.local
    depends_on:
      test-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  # Captură locală pentru toate emailurile generate în test. Portul SMTP rămâne
  # exclusiv în rețeaua Docker; doar interfața web este expusă pe host.
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: etox-test-mailpit
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Frontend de test — servit din container pe :3001, construit ca să țintească
  # backend-ul de test (:8001). Astfel ai O SINGURĂ adresă pentru test, fără `npm run dev`.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
    container_name: etox-test-frontend
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  test_db_data:
