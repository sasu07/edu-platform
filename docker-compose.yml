version: "3.8"

services:
  # ── Backend (FastAPI) ──
  backend:
    build:
      context: ./edu_content_api
      dockerfile: Dockerfile
    container_name: etox-backend
    ports:
      - "8000:8000"
    env_file:
      - ./edu_content_api/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist uploaded files
      - ./edu_content_api/uploaded_files:/app/uploaded_files
      # Persist assets (logo, etc.)
      - ./edu_content_api/assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend (React + Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: etox-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Montează dist/ local → Nginx servește direct fișierele compilate local.
      # Actualizare: rulează `npm run build` în /frontend, fără rebuild Docker.
      - ./frontend/dist:/usr/share/nginx/html:ro
