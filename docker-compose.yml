services:
  # Local development / local preview
  backend:
    build:
      context: ./edu_content_api
      dockerfile: Dockerfile
    container_name: etox-backend
    ports:
      - "8000:8000"
    env_file:
      - ./edu_content_api/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./edu_content_api/uploaded_files:/app/uploaded_files
      - ./edu_content_api/assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: etox-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Frontend-ul e servit din build-ul imaginii (construit cu VITE_API_URL=http://localhost:8000
    # din build-arg-ul de mai sus). Pentru a actualiza frontend-ul: `docker compose up -d --build frontend`.
    # (Nu montăm ./frontend/dist ca volum — ar umbri build-ul imaginii și ar servi URL-ul greșit.)
