# Acțiune fail2ban de banare compatibilă cu Docker.
#
# Docker își scrie propriile reguli de iptables și OCOLEȘTE chain-ul INPUT (deci
# acțiunile fail2ban implicite NU blochează traficul spre containere). Soluția:
# inserăm regulile de DROP în chain-ul DOCKER-USER, care e evaluat ÎNAINTEA
# regulilor de forwarding ale Docker.

[Definition]

actionstart = iptables -N f2b-<name> 2>/dev/null || true
              iptables -A f2b-<name> -j RETURN 2>/dev/null || true
              iptables -C DOCKER-USER -j f2b-<name> 2>/dev/null || iptables -I DOCKER-USER -j f2b-<name>

actionstop = iptables -D DOCKER-USER -j f2b-<name> 2>/dev/null || true
             iptables -F f2b-<name> 2>/dev/null || true
             iptables -X f2b-<name> 2>/dev/null || true

actioncheck = iptables -n -L DOCKER-USER | grep -q 'f2b-<name>'

actionban = iptables -I f2b-<name> 1 -s <ip> -j DROP

actionunban = iptables -D f2b-<name> -s <ip> -j DROP

[Init]
name = default
