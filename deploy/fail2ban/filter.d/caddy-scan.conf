# Filtru fail2ban pentru log-urile de acces Caddy (format JSON).
# Prinde: (a) orice cerere respinsă cu 403 (scanările blocate de block_scanners),
#         (b) cereri directe către rute tipice de bot (wp-*, .php, .env, .git etc.).
# Un utilizator legitim nu primește 403 și nu cere astfel de rute → zero fals-pozitive.

[Definition]

failregex = ^.*"remote_ip":"<HOST>"[^\n]*"status":403
            ^.*"remote_ip":"<HOST>"[^\n]*"uri":"[^"]*(?:wp-json|wp-login|wp-admin|xmlrpc\.php|wordpress|phpmyadmin|/\.env|/\.git|/\.aws|/\.ssh)[^\n]*

ignoreregex =

# Log-ul Caddy e o linie JSON per cerere; datetime luat din câmpul "ts".
datepattern = "ts":{EPOCH}
